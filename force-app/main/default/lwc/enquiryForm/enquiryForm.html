<template>
    <lightning-card title="Student Enquiry Form" icon-name="standard:case">
        <div class="slds-p-around_medium">

            <lightning-record-edit-form
                object-api-name="Enquiry__c"
                onsuccess={handleSuccess}
                onerror={handleError}>

                <lightning-messages></lightning-messages>

                <lightning-input-field field-name="Student__c">
                </lightning-input-field>

                <lightning-input-field field-name="Subject__c">
                </lightning-input-field>

                <lightning-input-field field-name="Category__c">
                </lightning-input-field>

                <lightning-input-field field-name="Description__c">
                </lightning-input-field>

                <lightning-input-field field-name="Status__c">
                </lightning-input-field>

                <div class="slds-m-top_medium">
                    <lightning-button
                        type="submit"
                        label="Submit Enquiry"
                        variant="brand">
                    </lightning-button>
                </div>

            </lightning-record-edit-form>
        </div>
    </lightning-card>
</template>
