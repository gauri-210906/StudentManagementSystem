
<template>
    <lightning-card title="Registered Students" icon-name="standard:people">
        <div class="slds-p-around_medium">

            <template if:true={students.data}>
                <lightning-datatable
                    key-field="Id"
                    data={students.data}
                    columns={columns}
                    hide-checkbox-column>
                </lightning-datatable>
            </template>

            <template if:true={students.error}>
                <div class="slds-text-color_error">
                    Unable to load student records.
                </div>
            </template>

            <template if:false={students.data}>
                <template if:false={students.error}>
                    <lightning-spinner
                        alternative-text="Loading students">
                    </lightning-spinner>
                </template>
            </template>

        </div>
    </lightning-card>
</template>
